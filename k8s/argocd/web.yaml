apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: framm-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kod-digor/kod-site-mail
    targetRevision: main
    path: k8s/apps/web
  destination:
    server: https://kubernetes.default.svc
    namespace: framm
  # HPA owns web capacity; GitOps must not reset it on every reconciliation.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: web
      namespace: framm
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
