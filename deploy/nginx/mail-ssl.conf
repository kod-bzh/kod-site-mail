server {
    listen 80;
    listen [::]:80;
    server_name webmail.${PRIMARY_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

